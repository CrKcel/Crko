name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # cmdline-tools 23.0: the runner's preinstalled 16.0 predates API 37.0 packages
          cmdline-tools-version: "16111833"
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: shared/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

