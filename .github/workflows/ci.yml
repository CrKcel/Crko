name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # cmdline-tools 23.0: the runner's preinstalled 16.0 predates API 37.0 packages
          cmdline-tools-version: "16111833"
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: shared/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Add APK to run summary
        run: |
          apk=$(ls androidApp/build/outputs/apk/debug/*.apk | head -1)
          {
            echo "### Crko Android"
            echo ""
            echo "| File | Size | Download |"
            echo "| --- | --- | --- |"
            echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1 | xargs) | [APK](${{ steps.upload-apk.outputs.artifact-url }}) |"
            echo ""
            echo "Install with \`adb install -r $(basename "$apk")\`."
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run iOS simulator tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p build/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Crko.app build/Payload/
          ditto -c -k --norsrc --noextattr --keepParent build/Payload build/Crko-unsigned.ipa

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-report
          path: shared/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload IPA
        id: upload-ipa
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: build/Crko-unsigned.ipa
          if-no-files-found: error

      - name: Add IPA to run summary
        run: |
          ipa=build/Crko-unsigned.ipa
          {
            echo "### Crko iOS"
            echo ""
            echo "| File | Size | Download |"
            echo "| --- | --- | --- |"
            echo "| $(basename "$ipa") | $(du -h "$ipa" | cut -f1 | xargs) | [IPA](${{ steps.upload-ipa.outputs.artifact-url }}) |"
            echo ""
            echo "Unsigned IPA: re-sign it (AltStore/Sideloadly) or add Apple signing credentials to install on a device."
          } >> "$GITHUB_STEP_SUMMARY"
