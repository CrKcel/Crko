  canary-release:
    name: Canary Release
    needs: android
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Publish canary pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="canary"
          short_sha="${GITHUB_SHA::7}"
          apk=$(find release-assets -type f -name '*.apk' | head -n 1)
          # ipa=$(find release-assets -type f -name '*.ipa' | head -n 1)
          if [ -z "$apk" ]; then
            echo "Missing APK in downloaded artifacts" >&2
            exit 1
          fi

          mkdir -p release-assets/out
          cp "$apk" "release-assets/out/Crko-${tag}-debug.apk"
          # cp "$ipa" "release-assets/out/Crko-${tag}-unsigned.ipa"

          {
            echo "Canary build from \`${short_sha}\` on $(date -u +%Y-%m-%d)."
            echo ""
            echo "- Commit: \`$(git log -1 --pretty=%s)\`"
            echo "- Run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > release-notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          else
            git push origin ":refs/tags/$tag" >/dev/null 2>&1 || true
          fi

          gh release create "$tag" \
            "release-assets/out/Crko-${tag}-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "Canary #${GITHUB_RUN_NUMBER} (${short_sha})" \
            --notes-file release-notes.md \

          {
            echo "### Canary release"
            echo ""
            echo "[${tag}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}) published as a pre-release."
          } >> "$GITHUB_STEP_SUMMARY"
